name: Reportar un error
description: Algo no funciona como debería.
title: "[Error] "
labels: ["error"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportarlo. **No incluyas datos financieros reales**: usa el modo discreto
        o datos de prueba en las capturas. Si es un problema de seguridad, no lo publiques aquí:
        sigue SECURITY.md.
  - type: textarea
    id: que-paso
    attributes:
      label: ¿Qué pasó?
      description: Describe el error y qué esperabas que ocurriera.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abre Tarjetas
        2. Toca …
        3. Aparece …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de Kren
      description: Perfil → Acerca de.
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: distribucion
    attributes:
      label: Distribución
      options:
        - privada
        - nube
    validations:
      required: true
  - type: input
    id: telefono
    attributes:
      label: Teléfono y versión de Android
      placeholder: Samsung Galaxy S24 FE, Android 17
  - type: textarea
    id: extra
    attributes:
      label: Capturas o registros
      description: Opcional. Recuerda ocultar los montos.
