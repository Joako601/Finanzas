name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Pruebas y guardias
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Valida el wrapper de Gradle y guarda la caché de dependencias.
      - uses: gradle/actions/setup-gradle@v4

      # Pruebas del dominio (JVM y JS), de la app y de los datos en la JVM, lint y las
      # guardias de permisos y dependencias. Las pruebas instrumentadas necesitan un
      # teléfono y se corren aparte (docs/verificacion.md).
      - name: ./gradlew check
        run: ./gradlew check --console=plain

      - name: Compilar las dos distribuciones en release
        run: ./gradlew :app:assemblePrivadaRelease :app:assembleNubeRelease --console=plain

      - name: Subir reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
