# Catálogo de versiones: única fuente de verdad para versiones de plugins y librerías.
# Toda dependencia nueva entra aquí con su justificación en docs/decisiones.md.
# Versiones estables consultadas el 2026-11-16 en dl.google.com/android/maven2 y repo1.maven.org.

[versions]
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.14"

# SDK de Android
compileSdk = "37"
targetSdk = "37"
minSdk = "26"

# AndroidX
activityCompose = "1.13.0"
composeBom = "2026.09.00"
lifecycle = "2.11.0"
room = "2.8.5"

# Kotlin
kotlinxCoroutines = "1.11.0"
kotlinxDatetime = "0.8.0"

# Nube (solo en :feature:nube y flavor nube; consultado el 2026-11-21 en dl.google.com/android/maven2)
firebaseBom = "35.2.0"

# Pruebas
kotest = "6.2.7"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
# Espresso viene con las pruebas de Compose (3.5.0), que no corre en Android 17: se fija la estable.
espresso = "3.7.0"
junit = "4.13.2"

[libraries]
# Dominio (multiplataforma)
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }

# Datos
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# Interfaz
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# Nube (solo :feature:nube; sin Analytics, Crashlytics ni Messaging)
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }

# Pruebas
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
